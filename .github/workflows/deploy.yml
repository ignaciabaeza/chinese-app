name: CI

# Deploys are pull-based: the server's chinese-app-autodeploy timer
# (scripts/auto-deploy.sh) deploys a new main commit once this job passes.
# Keep the job named `check` — auto-deploy.sh looks it up by name.

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit
